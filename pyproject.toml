[project]
name = "atomizer-text"
version = "0.1.0"
description = "OSM semantic overlay pilot for Atomizer text tokens."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "geopandas>=1.1.3",
    "huggingface-hub>=1.19.0",
    "matplotlib>=3.11.0",
    "numpy>=2.4.6",
    "osmnx>=2.1.0",
    "pyproj>=3.7.2",
    "rasterio>=1.5.0",
    "shapely>=2.1.2",
]

[project.scripts]
atomizer-osm-pilot = "atomizer_osm_pilot.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atomizer_osm_pilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "network: tests that hit the real Overpass API (skipped by default)",
]
